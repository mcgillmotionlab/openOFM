name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)

    environment:
      name: pypi
      url: https://pypi.org/p/openofm

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        # Configure the trusted publisher at:
        # https://pypi.org/manage/project/openofm/settings/publishing/
