[project]
name = "openOFM"
version = "1.1.0"
description = "Python implementation of the Oxford Foot Model (OFM) gait analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "ezc3d>=1.5.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mcgillmotionlab/openOFM"
Documentation = "https://mcgillmotionlab.github.io/openOFM"
Repository = "https://github.com/mcgillmotionlab/openOFM"
"Bug Tracker" = "https://github.com/mcgillmotionlab/openOFM/issues"

[project.scripts]
openofm-static   = "openofm.static:main"
openofm-dynamic  = "openofm.dynamic:main"
openofm-validate = "openofm.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openofm"]

[dependency-groups]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild>=2024.0.0",
]
dev = [
    "pytest>=8.0",
    "hatchling>=1.25",
]


